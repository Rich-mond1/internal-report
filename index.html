<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Store Visit Report</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F3D3E">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Store Visit Report</h1>
    <span id="sync-indicator" class="sync-indicator"></span>
  </header>

  <div class="build-version">
    <span id="build-version-text"></span>
    <button type="button" id="btn-update-app" class="btn-link-inline">Update</button>
  </div>

  <main id="app">
    <section id="screen-info" class="screen">
      <label>Shop
        <select id="input-shop">
          <option value="">Select a shop</option>
        </select>
      </label>
      <div id="shop-error" class="field-error" hidden>Select a shop first</div>
      <label>Manager on duty
        <input type="text" id="input-manager" placeholder="Name" autocomplete="off">
      </label>
      <label>Visit date
        <input type="date" id="input-date">
      </label>
      <button id="btn-continue" class="btn-primary">Continue</button>
    </section>

    <section id="screen-grid" class="screen" hidden>
      <div class="visit-summary">
        <button id="btn-edit-info" class="btn-link">✎ <span id="summary-text"></span></button>
        <div class="save-status">Autosaved on this device — works fully offline</div>
      </div>
      <div id="followup-panel" class="followup-panel" hidden></div>
      <div id="groups-root"></div>

      <div class="finish-panel">
        <div class="field-label">Overall visit score (optional)</div>
        <div id="score-picker" class="score-picker"></div>
        <div class="score-meta">
          <span id="score-readout"></span>
          <button type="button" id="btn-clear-score" class="btn-link-inline">Clear</button>
        </div>
        <label>Final summary (optional)
          <textarea id="final-comment" rows="3" placeholder="Anything not captured above..."></textarea>
        </label>
        <button id="btn-export" class="btn-primary btn-large">Save &amp; create draft</button>
        <button id="btn-new-visit" class="btn-link">New visit</button>
      </div>
    </section>

    <section id="screen-category" class="screen" hidden>
      <div class="cat-bar">
        <button type="button" id="btn-back" class="btn-back">← Categories</button>
        <h2 id="category-title"></h2>
      </div>
      <div id="category-prev-comment" class="prev-comment" hidden></div>
      <div id="category-items" class="items-list"></div>

      <button type="button" id="btn-add-item" class="btn-add-item">+ Add item</button>
      <div id="add-item-form" class="add-item-form" hidden>
        <input type="text" id="new-item-label" placeholder="Item to check" autocomplete="off">
        <button type="button" id="btn-confirm-add-item" class="btn-small-primary">Add</button>
        <button type="button" id="btn-cancel-add-item" class="btn-small">Cancel</button>
      </div>

      <label class="comment-label">Comment
        <textarea id="category-comment" rows="4" placeholder="Notes, findings, actions..."></textarea>
      </label>
      <button type="button" id="btn-next" class="btn-primary">Done → Categories</button>
      <button type="button" id="btn-back-bottom" class="btn-link">← Categories</button>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
